[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-continue"
version = "0.1.0"
description = "Durably observe a long-running task and queue `continue` to its Codex thread."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "durable-continue"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/Shadow-Alex/durable-continue"
Repository = "https://github.com/Shadow-Alex/durable-continue"
Issues = "https://github.com/Shadow-Alex/durable-continue/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
durable-continue = "durable_continue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-continue"
version = "0.4.0"
description = "Local runtime and Desktop dispatcher for Sleepy Agent."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Sleepy Agent contributors"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/Shadow-Alex/sleepy-agent"
Repository = "https://github.com/Shadow-Alex/sleepy-agent"
Issues = "https://github.com/Shadow-Alex/sleepy-agent/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
durable-continue = "durable_continue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
